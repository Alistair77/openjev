<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="430" fill="#0e1116"/>
<text x="30" y="38" fill="#f2f4f8" font-size="22" font-weight="bold">OpenJev architecture</text>
<text x="30" y="60" fill="#9aa4b2" font-size="13">State + typed questions in, probabilities + abstention + trace out</text>
<rect x="30" y="90" width="180" height="90" rx="10" fill="#16202b" stroke="#2f81f7"/>
<text x="46" y="116" fill="#7fb3ff" font-size="12" font-weight="bold">INPUT</text>
<text x="46" y="138" fill="#f2f4f8" font-size="14">state (any JSON)</text>
<text x="46" y="158" fill="#f2f4f8" font-size="14">choice / score / noul</text>
<rect x="240" y="90" width="180" height="90" rx="10" fill="#16202b" stroke="#2f81f7"/>
<text x="256" y="116" fill="#7fb3ff" font-size="12" font-weight="bold">CONTRACT (Pydantic v1)</text>
<text x="256" y="138" fill="#f2f4f8" font-size="14">EvaluateRequest</text>
<text x="256" y="158" fill="#9aa4b2" font-size="12">validation + abstain_below</text>
<rect x="450" y="90" width="280" height="90" rx="10" fill="#16202b" stroke="#2f81f7"/>
<text x="466" y="116" fill="#7fb3ff" font-size="12" font-weight="bold">BACKENDS</text>
<text x="466" y="138" fill="#f2f4f8" font-size="13">local heuristic (offline)</text>
<text x="466" y="158" fill="#f2f4f8" font-size="13">research scorer / mock / remote</text>
<rect x="30" y="215" width="700" height="120" rx="10" fill="#12241a" stroke="#3fb950"/>
<text x="46" y="241" fill="#7ee787" font-size="12" font-weight="bold">OUTPUT PER QUESTION</text>
<text x="46" y="265" fill="#f2f4f8" font-size="14">probabilities (sum to 1) + confidence (1 - normalized entropy)</text>
<text x="46" y="289" fill="#f2f4f8" font-size="14">choice / score / noul + alternatives + margin</text>
<text x="46" y="313" fill="#f2f4f8" font-size="14">abstained flag + audit trace (backend, latency_ms)</text>
<line x1="210" y1="135" x2="240" y2="135" stroke="#2f81f7" stroke-width="2" marker-end="url(#a)"/>
<line x1="420" y1="135" x2="450" y2="135" stroke="#2f81f7" stroke-width="2"/>
<line x1="590" y1="180" x2="590" y2="215" stroke="#3fb950" stroke-width="2"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#2f81f7" stroke-width="1.5"/></marker></defs>
<text x="30" y="368" fill="#9aa4b2" font-size="12">Surfaces: FastAPI + playground (/) + OpenAPI (/docs) + CLI (openjev) + TS SDK + Claude skill</text>
<text x="30" y="390" fill="#9aa4b2" font-size="12">Inspired by the public Jev/GEV-Jeff interface idea. No proprietary weights or data inside.</text>
</svg>
