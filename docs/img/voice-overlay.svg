<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="560" fill="#0e1116"/>
<text x="30" y="34" fill="#f2f4f8" font-size="18" font-weight="bold">Voice overlay states (design mock — live version renders natively on macOS)</text>
<g font-size="14">
<rect x="30" y="60" width="700" height="80" rx="20" fill="#141311" stroke="#2a2a2a"/>
<circle cx="80" cy="100" r="6" fill="#7fb3ff"/><circle cx="80" cy="100" r="12" fill="none" stroke="#7fb3ff" opacity="0.5"/>
<text x="110" y="96" fill="#f2f4f8" font-weight="600">Listening…</text>
<text x="110" y="118" fill="#9aa4b2" font-size="12">press hotkey again to stop</text>
<rect x="30" y="154" width="700" height="80" rx="20" fill="#141311" stroke="#2a2a2a"/>
<circle cx="80" cy="194" r="6" fill="#e3b341"/>
<text x="110" y="190" fill="#f2f4f8" font-weight="600">Heard you…</text>
<text x="110" y="212" fill="#9aa4b2" font-size="12">open brave browser</text>
<rect x="30" y="248" width="700" height="80" rx="20" fill="#141311" stroke="#2a2a2a"/>
<circle cx="80" cy="288" r="6" fill="#ed9d62"/>
<text x="110" y="284" fill="#f2f4f8" font-weight="600">Opening Brave Browser…</text>
<text x="110" y="306" fill="#9aa4b2" font-size="12">open brave browser</text>
<rect x="30" y="342" width="700" height="80" rx="20" fill="#141311" stroke="#2a2a2a"/>
<circle cx="80" cy="382" r="14" fill="none" stroke="#34c759" stroke-width="3"/>
<path d="M72 382 l6 6 l12 -14" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round"/>
<text x="110" y="378" fill="#f2f4f8" font-weight="600">Done ✓</text>
<text x="110" y="400" fill="#9aa4b2" font-size="12">open brave browser → back to listening</text>
<rect x="30" y="436" width="700" height="80" rx="20" fill="#141311" stroke="#2a2a2a"/>
<circle cx="80" cy="476" r="14" fill="none" stroke="#ff453a" stroke-width="3"/>
<path d="M73 469 l14 14 M87 469 l-14 14" stroke="#ff453a" stroke-width="3" stroke-linecap="round"/>
<text x="110" y="472" fill="#f2f4f8" font-weight="600">Failed — still listening</text>
<text x="110" y="494" fill="#9aa4b2" font-size="12">nothing executed blindly, session continues</text>
</g>
<text x="30" y="542" fill="#9aa4b2" font-size="12">Top-center, click-through, never steals focus. Unheard input returns to Listening with no check or cross.</text>
</svg>
