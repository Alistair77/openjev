<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="360" fill="#0e1116"/>
<text x="30" y="34" fill="#f2f4f8" font-size="18" font-weight="bold">Decision latency, ms (log scale)</text>
<text x="30" y="86" fill="#9aa4b2" font-size="12">openjev local (3 questions)</text>
<rect x="260" y="70" width="22" height="22" rx="4" fill="#3fb950"/>
<text x="290" y="87" fill="#f2f4f8" font-size="13" font-weight="bold">0.075 ms</text>
<text x="30" y="130" fill="#9aa4b2" font-size="12">openjev research predict</text>
<rect x="260" y="114" width="34" height="22" rx="4" fill="#3fb950"/>
<text x="302" y="131" fill="#f2f4f8" font-size="13" font-weight="bold">0.095 ms</text>
<text x="30" y="174" fill="#9aa4b2" font-size="12">verdict-2.0 (150M, per their E7)</text>
<rect x="260" y="158" width="330" height="22" rx="4" fill="#8d4318"/>
<text x="598" y="175" fill="#f2f4f8" font-size="13" font-weight="bold">25.0 ms</text>
<text x="30" y="218" fill="#9aa4b2" font-size="12">TypeSafe Jev (per their table)</text>
<rect x="260" y="202" width="421" height="22" rx="4" fill="#77736c"/>
<text x="689" y="219" fill="#f2f4f8" font-size="13" font-weight="bold">140.0 ms</text>
<text x="30" y="272" fill="#9aa4b2" font-size="11">Ours measured here (200 runs, receipts in docs/captures/latency.json).</text>
<text x="30" y="290" fill="#9aa4b2" font-size="11">Theirs as reported in their repo (E7 latency receipts + benchmark table).</text>
<text x="30" y="316" fill="#9aa4b2" font-size="11">Speed is our edge: byte math is ~300x faster than a 150M forward pass — and far dumber.</text>
</svg>