[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openjev"
version = "0.1.0"
description = "Open, local-first typed decision intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alistair R" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
research = ["numpy>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
openjev = "openjev.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["openjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
